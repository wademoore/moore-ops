<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- One small corner spiderweb, anchored at the top-left origin.

       Five radials and five sagging cross-strands, up from three and three:
       at the size this mark can occupy without reaching the NOW / NEXT
       lettering, three strands read as stray diagonals rather than a web. The
       ring count is what makes it legible, not the box size.

       Transparent line art used as a CSS mask so it takes the theme highlight
       tone from the stylesheet. Decoration only. -->
