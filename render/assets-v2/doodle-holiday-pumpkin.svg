<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outline pumpkin. Repo-native line art, no fill, transparent ground: the
       renderer uses it as a CSS mask so it takes the theme highlight tone from
       the stylesheet rather than shipping in a colour. Decoration only - it
       never replaces a semantic activity icon or an official sports logo.

       Four interior ribs and a thick curled stem, both deliberate: at
       television distance a two-rib outline with a thin straight stem read as
       an apple. The wide squat body (ry noticeably less than rx) is the other
       half of that fix. -->
