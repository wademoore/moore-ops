  <path d="M86 50c7 13 7 39 0 60"/>
  <path d="M53 46c-4 14-4 44 0 66"/>
  <path d="M75 46c4 14 4 44 0 66"/>
  <path d="M64 44c0-11 2-18 7-24" stroke-width="8"/>
  <path d="M71 20c8-5 16-3 20 4 3 6 1 12-5 14" stroke-width="7"/>
</svg>
