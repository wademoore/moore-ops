name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.git/**'
      - '!.github/**'
      - '.github/workflows/deploy.yml'
      - '!test/**'
      - '!logs/**'
      - '!run-digest.bat'
      - '!**.env'
      - '!**.log'
      - '!render/assets-first-day/**'
      - '!render/assets-v2/**'
      - '!docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Runs held by the deploy window are released together; the group keeps their
# deploys serial.
concurrency:
  group: deploy-lambda
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bounds the hold.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      # Evaluated here, immediately before the credentials and the deploy. It
      # waits rather than fails: the merge has already landed.
      - name: Hold deploy until outside the deploy window
        run: node scripts/deploy-window-guard.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build zip package
        run: |
          zip -r function.zip . \
            --exclude "*.env" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "test/*" \
            --exclude "logs/*" \
            --exclude "run-digest.bat" \
            --exclude "*.log" \
            --exclude "render/assets-first-day/*" \
            --exclude "render/assets-v2/*" \
            --exclude "docs/*"

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --region ${{ secrets.AWS_REGION }}
          echo "✓ Lambda updated successfully"

  # Notifies the repository owner whichever actor pushed.
  notify-failure:
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue assigned to the repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$REPO" \
            --assignee "$OWNER" \
            --title "Deploy failed: $WORKFLOW at ${SHA:0:7}" \
            --body "@$OWNER the \"$WORKFLOW\" run for commit $SHA failed. Run: $RUN_URL"
